<div class = 'dropdown-container'>
  <label for = 'custom-select'>Choose an option:</label>
  <select id = 'custom-select' [(ngModel)] = 'selectedId' (ngModelChange) = 'onSelectionChange($event)'>
    <option [value] = 'null' disabled selected>-- Select a Label --</option>
    @for(option of options(); track option.id){<option [value] = 'option.id'>{{ option.name }}</option>}
  </select>
  <!-- Conditional feedback UI using @if -->
  @if(selectedItem()){
    <div class = 'selection-feedback'>
      <p>Active Selection: <strong>{{ selectedItem()?.name }}</strong> (ID: {{ selectedId() }})</p>
    </div>
  }
</div>
<app-custom-dropdown [(customSelectedId)] = 'selectedId' [options] = 'options()' />
