<input [(ngModel)] = 'query' placeholder = 'Type to search...' />

@if(results.isLoading()){<p>Loading...</p>}
@else if(results.value(); as items){
	<ul>
		@for(item of items; track item.id){<li>{{ item.id }}. {{ item.title }}</li>}
	</ul>
}

*search works!*
