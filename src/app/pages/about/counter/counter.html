<div class = 'container'>
	<h1 class = 'title'>{{title()}}</h1>

	<!-- Direct local updates push straight back to the parent component -->
	<div class = 'counter'>
		<button (click) = 'counter.update(v => v - 1)'  class = 'svg'><svg xmlns = 'http://w3.org' viewBox='0 0 24 24'><path d = 'M5 11h14v2H5z' /></svg></button>
			<div class = 'count'>{{counter()}}</div>
		<button (click) = 'counter.update(v => v + 1)'  class = 'svg'><svg xmlns = 'http://w3.org' viewBox='0 0 24 24'><path d = 'M11 5v6H5v2h6v6h2v-6h6v-2h-6V5z' /></svg></button>
	</div>

	<div class = 'resetButton'>
		<span class = 'reset'><button (click) = 'reset()'>Reset</button></span>
	</div>
</div>
